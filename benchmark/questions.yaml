  gold_sql: "SELECT p.program_name FROM programs p JOIN students s ON s.program_id = p.program_id JOIN fees f ON f.student_id = s.student_id WHERE f.academic_year = '2026-27' GROUP BY p.program_id ORDER BY SUM(f.amount_due - f.amount_paid) DESC LIMIT 1;"
