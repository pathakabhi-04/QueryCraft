# ------------------------------------------------------------------ hard (20)

- id: Q056
  question: "Which students have less than 75% attendance in any subject this semester? Show name and programme."
  category: hard
  expected_status: OK
  gold_sql: "SELECT s.name, p.program_name FROM students s JOIN programs p ON s.program_id = p.program_id WHERE s.student_id IN (SELECT e.student_id FROM enrollments e JOIN attendance a ON a.enrollment_id = e.enrollment_id WHERE e.academic_year = '2026-27' AND 100.0 * a.classes_attended / a.classes_held < 75);"
  order_matters: false
  verified: false
  notes: "'This semester' = 2026-27 (only its odd semester has enrollments). Each student listed once."

- id: Q057
  question: "How many students have overall attendance below 75% in 2026-27, taking all their subjects together?"
  category: hard
  expected_status: OK
  gold_sql: "SELECT COUNT(*) FROM (SELECT e.student_id FROM enrollments e JOIN attendance a ON a.enrollment_id = e.enrollment_id WHERE e.academic_year = '2026-27' GROUP BY e.student_id HAVING 100.0 * SUM(a.classes_attended) / SUM(a.classes_held) < 75);"
  order_matters: false
  verified: false
  notes: "Overall = total attended / total held, not the average of per-subject percentages."

- id: Q058
  question: "Top 5 students by average total marks (internal + external) in 2025-26, with their average."
  category: hard
  expected_status: OK
  gold_sql: "SELECT s.name, AVG(r.internal_marks + r.external_marks) AS avg_total FROM students s JOIN enrollments e ON e.student_id = s.student_id JOIN exam_results r ON r.enrollment_id = e.enrollment_id WHERE e.academic_year = '2025-26' GROUP BY s.student_id ORDER BY avg_total DESC LIMIT 5;"
  order_matters: false
  verified: false
  notes: "Ranks 4 and 5 tie (94.5), so row order is not compared; the top-5 set itself is unambiguous (rank 6 is 94.25)."

- id: Q059
  question: "Which programme has the highest pending dues for 2026-27?"
